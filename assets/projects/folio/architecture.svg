<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc"><title id="title">Folio Studio architecture</title><desc id="desc">A server-rendered Laravel MVC application: the browser communicates with routes and middleware, controllers access relational data and image storage, and Blade produces the HTML response.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#83759f"/></marker></defs><rect width="1400" height="700" fill="#f7f6f3"/><g font-family="Arial,sans-serif"><text x="70" y="75" font-size="18" fill="#6851bb" letter-spacing="3">FOLIO STUDIO</text><text x="70" y="126" font-size="36" fill="#24252b">Server-rendered Laravel MVC</text><text x="70" y="160" font-size="16" fill="#6c6d76">One application. Shared content. Five portfolio designs.</text><g fill="white" stroke="#ded9e5"><rect x="70" y="260" width="215" height="120" rx="15"/><rect x="340" y="260" width="240" height="120" rx="15"/><rect x="635" y="260" width="240" height="120" rx="15"/><rect x="940" y="200" width="350" height="105" rx="15"/><rect x="940" y="345" width="350" height="105" rx="15"/><rect x="340" y="485" width="535" height="105" rx="15"/></g><g font-size="20" fill="#24252b"><text x="96" y="303">Browser</text><text x="366" y="303">Routes &amp; middleware</text><text x="660" y="303">Controllers</text><text x="965" y="241">Relational database</text><text x="965" y="386">Filesystem storage</text><text x="367" y="526">Blade views &amp; shared partials</text></g><g font-size="13" fill="#6c6d76"><text x="96" y="333">HTML · CSS · JavaScript</text><text x="366" y="333">Sessions · auth guards · CSRF</text><text x="660" y="333">Validation · ownership · CRUD</text><text x="965" y="268">SQLite · Eloquent · query builder</text><text x="965" y="413">Validated portfolio image uploads</text><text x="367" y="553">Forma / Noir / Editorial / Studio / Terminal</text></g><g stroke="#83759f" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M285 320h50"/><path d="M580 320h50"/><path d="M875 298h35v-45h25"/><path d="M875 343h35v55h25"/><path d="M755 380v99"/><path d="M340 538H178V386"/></g><text x="185" y="471" font-size="12" fill="#83759f">HTML response</text><text x="70" y="651" font-size="13" fill="#6c6d76">Data model: User → Page → selected Template. Nine content tables belong to the Page through pages_id.</text></g></svg>
